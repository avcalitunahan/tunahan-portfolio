name: Deploy Cloud Resume to S3

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Pull the Code
    - name: Checkout code
      uses: actions/checkout@v4

    # Node.js Setup
    - name: Setup Node.js 
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    # Install Dependencies
    - name: Install Dependencies
      run: npm install
    
    # Build Project
    - name: Build Project
      run: npm run build

    # Configure AWS Credentials
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{secrets.AWS_ROLE_ARN}}
        aws-region: ${{secrets.AWS_REGION}}

    # Deploy to S3
    - name: Deploy to S3
      run: aws s3 sync ./dist s3://${{secrets.AWS_S3_BUCKET_NAME}}  --follow-symlinks --delete
    